<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang Cá Nhân</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .profile-card {
            background: white;
            border-radius: 25px;
            padding: 40px 30px;
            max-width: 420px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.15);
        }

        .photo-frame {
            width: 280px;
            height: 280px;
            border-radius: 20px;
            margin: 0 auto 25px;
            overflow: hidden;
            border: 5px solid #fff;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
        }

        .photo-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        h1 {
            color: #333;
            font-size: 26px;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #e86a4e;
            font-size: 16px;
            margin-bottom: 20px;
        }

        .description {
            color: #666;
            font-size: 15px;
            line-height: 1.7;
            margin-bottom: 25px;
        }

        .friends-tag {
            display: inline-block;
            background: linear-gradient(135deg, #ff9a9e, #fad0c4);
            color: #8b4513;
            padding: 10px 25px;
            border-radius: 30px;
            font-size: 15px;
            font-weight: 500;
        }

        .heart {
            color: #ff4757;
            font-size: 20px;
            animation: heartbeat 1.5s infinite;
        }

        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.2); }
        }
    </style>
</head>
<body>
    <div class="profile-card">
        <div class="photo-frame">
            <img src="anh-ban-be.jpg" alt="Ảnh bạn bè">
        </div>
        <h1>Tên Của Bạn 👋</h1>
        <p class="subtitle">💖 Những người bạn tuyệt vời</p>
        <p class="description">
            Đây là những người bạn tuyệt vời nhất của mình! 
            Cùng nhau học tập, cùng nhau vui chơi. 
            Mong chúng ta luôn bên nhau nhé! ✨
        </p>
        <p class="friends-tag">Mãi là bạn tốt <span class="heart">❤️</span></p>
    </div>
</body>
</html>
